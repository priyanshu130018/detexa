services:
  # ── 1. Redis Feature Store & Real-Time Cache ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: detexa_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # ── 2. Apache Kafka (KRaft Mode - Distributed Event Streaming) ─────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: detexa_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 3. Apache Flink Stream Processing (JobManager) ─────────────────────────
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: detexa_flink_jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/checkpoints
        heartbeat.timeout: 10000
    ports:
      - "8081:8081" # Flink Dashboard Web UI
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 4. Apache Flink Stream Processing (TaskManager) ─────────────────────────
  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: detexa_flink_taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1024m
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks:
      - detexa_network
    restart: unless-stopped

  # ── 5. Database Schema Migration (Dedicated One-Shot Service) ──────────────
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detexa_db_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://detexa_user:detexa_pass@postgres-local:5432/detexa_db}
      SKIP_MIGRATIONS: "true"
    networks:
      - detexa_network
    restart: "no"

  # ── 6. FastAPI Backend Server (AI Inference & Decision Engine) ────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detexa_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://detexa_user:detexa_pass@postgres-local:5432/detexa_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: 8081
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
      SECRET_KEY: ${SECRET_KEY:-detexa_secure_secret_key_placeholder_min_32_chars}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SKIP_MIGRATIONS: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
        required: false
    volumes:
      - ./backend/app/ml/saved:/app/app/ml/saved:ro
      - backend_logs:/app/logs
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── 7. Apache Flink Real-Time Streaming Worker ────────────────────────────
  flink-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: detexa_flink_worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://detexa_user:detexa_pass@postgres-local:5432/detexa_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: 8081
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/saved:/app/app/ml/saved:ro
      - backend_logs:/app/logs
    networks:
      - detexa_network
    restart: unless-stopped

  # ── 8. React + TypeScript Frontend (AI Defense Dashboard) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: detexa_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ── Optional: Local PostgreSQL (Profile: local-db) ──────────────────────────
  postgres-local:
    image: postgres:16-alpine
    container_name: detexa_postgres_local
    profiles:
      - local-db
    environment:
      POSTGRES_DB: detexa_db
      POSTGRES_USER: detexa_user
      POSTGRES_PASSWORD: detexa_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detexa_user -d detexa_db || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

# ── Persistent Storage Volumes ───────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  kafka_data:
    driver: local
  backend_logs:
    driver: local
  postgres_data:
    driver: local

# ── Isolated Internal Network ────────────────────────────────────────────────
networks:
  detexa_network:
    driver: bridge
