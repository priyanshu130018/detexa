version: "3.8"

services:
  # ── 1. Redis Feature Store & Real-Time Cache ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: detexa_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── 2. Neo4j Graph Database ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18.0-community
    container_name: detexa_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-detexa_neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474" # Web Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-detexa_neo4j_password}", "RETURN 1"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ── 3. Apache Kafka (KRaft Mode - Distributed Event Streaming) ─────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: detexa_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 4. Apache Flink Stream Processing (JobManager) ─────────────────────────
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: detexa_flink_jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        state.backend: filesystem
        state.checkpoints.dir: file:///tmp/checkpoints
        heartbeat.timeout: 10000
    ports:
      - "8081:8081" # Flink Dashboard Web UI
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── 5. Apache Flink Stream Processing (TaskManager) ─────────────────────────
  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: detexa_flink_taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1024m
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    networks:
      - detexa_network
    restart: unless-stopped

  # ── 6. Apache Flink Real-Time Streaming Worker ────────────────────────────
  flink-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detexa_flink_worker
    command: ["python", "-m", "flink.run_job"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-detexa_neo4j_password}
      NEO4J_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: 8081
    depends_on:
      backend:
        condition: service_healthy
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/saved:/app/app/ml/saved
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m flink.run_job' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - detexa_network
    restart: unless-stopped

  # ── 7. FastAPI Backend (AI Inference, Decision Engine & Stream Hub) ────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detexa_backend
    env_file:
      - ./backend/.env
    environment:
      # Neon PostgreSQL Connection from environment
      DATABASE_URL: ${DATABASE_URL}
      # Container-to-container service networking
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-detexa_neo4j_password}
      NEO4J_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      FLINK_JOBMANAGER_HOST: flink-jobmanager
      FLINK_JOBMANAGER_PORT: 8081
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - ./backend/app/ml/saved:/app/app/ml/saved
      - ./backend/logs:/app/logs
    networks:
      - detexa_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── 7. React + TypeScript Frontend (AI Defense Dashboard) ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: detexa_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - detexa_network
    restart: unless-stopped

# ── Persistent Storage Volumes ───────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  kafka_data:
    driver: local
  flink_data:
    driver: local

# ── Isolated Internal Network ────────────────────────────────────────────────
networks:
  detexa_network:
    driver: bridge
