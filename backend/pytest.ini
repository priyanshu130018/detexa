[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
markers =
    unit: Unit tests that run isolated in-memory
    integration: Integration tests requiring external Docker services
    api: API endpoint tests via HTTP client
    e2e: Complete end-to-end user and streaming pipeline tests
